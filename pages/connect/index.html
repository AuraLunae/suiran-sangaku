<!DOCTYPE html>
<html lang="ja">

<head>
    <title>翠嵐山岳部　Connect</title>
    <meta name="description" content="翠嵐山岳部は、現在41名（1年17名、2年10名、3年14名）でゆる〜く楽しく安全に活動しています。" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet" />
    <link href="/style.css" rel="stylesheet" />
    <link href="/component/css/button.css" rel="stylesheet" />
    <link href="/component/css/hamburger.css" rel="stylesheet" />
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script src="/component/js/main.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="/favicon.svg" alt="logo" width="40px" height="40px" />
            <p>翠嵐山岳部　<br class="sp" /><span id="element1"></span></p>
            <script>
                var typed = new Typed("#element1", {
                    strings: ["Connect"],
                    typeSpeed: 50,
                });
            </script>
        </div>
        <div id="header"></div>
    </header>
    <main>
        <img class="face-img" src="/img/81-8-1~3-tateyama/2026-8-3.jpeg" alt="" />
        <div class="connect" class="about-us">
            <h2>お問い合わせ</h2>
            <form action="/api/message" method="POST">
                <div>
                    <label for="name">お名前</label>
                    <input name="name" id="name" placeholder="山岳　太郎" />
                </div>
                <div>
                    <label for="email">メールアドレス</label>
                    <input name="email" id="email" placeholder="example@example.com" />
                </div>
                <div>
                    <label for="subject">件名</label>
                    <input name="subject" id="subject" placeholder="山登りの件について" />
                </div>
                <div>
                    <label for="message">お問い合わせ内容</label>
                    <input name="message" id="message" placeholder="お問い合わせ内容を入力してください" />
                </div>
                <div>
                    <button>Send my greetings</button>
                </div>
            </form>
        </div>
        <div class="qa">
            <h2>
                Ｑ＆Ａ
                <span class="sub">〜なぜか１年生に聞いてみた〜</span>
            </h2>
            <p></p>
            <div class="q">
                <span class="big">Ｑ</span>
                <p>反応しないボタンがあるのですが</p>
            </div>
            <div class="a">
                <span class="big">Ａ</span>
                <div>
                    <p>申し訳ございません。</p>
                    <p>
                        開発途中ですので、反応しないボタンが残っております。ご了承ください。
                    </p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div id="footer"></div>
    </footer>
</body>

</html>
