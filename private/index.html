<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>データベース</title>
    <meta name="description" content="データベースのファイルをダウンロードできます。" />
    <meta name="robots" content="noindex" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap"
      rel="stylesheet"
    />
    <link href="/style.css" rel="stylesheet" />
    <link href="/private/style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="logo">
        <p>データベース</p>
      </div>
    </header>
    <main>
      <div class="db-intro">
        <h2>データベース</h2>
        <p>以下のファイルをダウンロードできます。</p>
      </div>
      <div class="db-list-block">
        <h2>ファイル一覧</h2>
        <ul class="db-list" id="db-list"></ul>
        <p class="db-message" id="db-message">読み込み中…</p>
      </div>
    </main>
    <footer>
      <div class="copy">
        <p>&copy;2026</p>
      </div>
    </footer>
    <script>
      (function () {
        var list = document.getElementById("db-list");
        var message = document.getElementById("db-message");

        function formatSize(bytes) {
          if (bytes < 1024) return bytes + " B";
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
          if (bytes < 1024 * 1024 * 1024)
            return (bytes / 1024 / 1024).toFixed(1) + " MB";
          return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
        }

        function formatDate(iso) {
          var d = new Date(iso);
          if (isNaN(d)) return "";
          return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        // 実在するファイルか確認する。
        // 存在しないとサーバーは 404.html 等のHTMLを返し、download属性のせいで
        // それがファイルとして保存されてしまうため、事前に弾く。
        function checkExists(href, name) {
          var isHtml = /\.html?$/i.test(name);
          return fetch(href, { method: "HEAD", cache: "no-cache" })
            .then(function (res) {
              if (!res.ok) return false;
              var type = (res.headers.get("content-type") || "").toLowerCase();
              if (!isHtml && type.indexOf("text/html") !== -1) return false;
              return true;
            })
            .catch(function () {
              return false;
            });
        }

        function toHref(path) {
          return (
            "/private/data/" + path.split("/").map(encodeURIComponent).join("/")
          );
        }

        // 濁点・半濁点のある日本語ファイル名は、Mac等で保存すると「そ+゛」のように
        // 分解された形(NFD)になり、files.json に書いた形(NFC)と別物として
        // 扱われて404になる。書かれたまま・NFC・NFDの順に試し、最初に見つかった方を使う。
        function resolveHref(path) {
          var candidates = [path];
          if (String.prototype.normalize) {
            [path.normalize("NFC"), path.normalize("NFD")].forEach(function (p) {
              if (candidates.indexOf(p) === -1) candidates.push(p);
            });
          }
          var i = 0;
          function next() {
            if (i >= candidates.length) return Promise.resolve(null);
            var cand = candidates[i++];
            var cname = cand.split("/").pop();
            return checkExists(toHref(cand), cname).then(function (ok) {
              return ok ? { href: toHref(cand), name: cname } : next();
            });
          }
          return next();
        }

        function render(files) {
          if (!files.length) {
            message.textContent = "ダウンロードできるファイルはまだありません。";
            return;
          }
          message.style.display = "none";
          files.forEach(function (file) {
            var name = file.path.split("/").pop();
            var dot = name.lastIndexOf(".");
            var ext = dot > 0 ? name.slice(dot + 1) : "file";

            var li = document.createElement("li");
            li.className = "db-item";

            var badge = document.createElement("div");
            badge.className = "db-ext";
            badge.textContent = ext.slice(0, 5);

            var info = document.createElement("div");
            info.className = "db-info";
            var title = document.createElement("p");
            title.className = "db-name";
            title.textContent = file.path;
            var meta = document.createElement("p");
            meta.className = "db-meta";
            var parts = [];
            if (typeof file.size === "number") parts.push(formatSize(file.size));
            if (file.modified) parts.push("更新：" + formatDate(file.modified));
            meta.textContent = parts.join("　");
            if (!parts.length) meta.style.display = "none";
            info.appendChild(title);
            info.appendChild(meta);

            var link = document.createElement("a");
            link.className = "db-download is-disabled";
            link.setAttribute("aria-disabled", "true");
            link.textContent = "確認中…";
            resolveHref(file.path).then(function (found) {
              if (found) {
                link.href = found.href;
                link.setAttribute("download", found.name);
                link.removeAttribute("aria-disabled");
                link.className = "db-download";
                link.textContent = "ダウンロード";
              } else {
                link.className = "db-download is-disabled";
                link.textContent = "ファイルが見つかりません";
              }
            });

            li.appendChild(badge);
            li.appendChild(info);
            li.appendChild(link);
            list.appendChild(li);
          });
        }

        fetch("/private/files.json", { cache: "no-cache" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (json) {
            render(json.files || []);
          })
          .catch(function () {
            message.textContent = "ファイル一覧を読み込めませんでした。";
          });
      })();
    </script>
  </body>
</html>
